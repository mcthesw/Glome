name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name != 'workflow_dispatch'
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  package-addon:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - name: Package and upload addon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          git archive --format=zip --output="glome-${TAG}.zip" HEAD addons/glome LICENSE
          gh release upload "$TAG" "glome-${TAG}.zip" --clobber
