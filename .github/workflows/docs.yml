name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'README.md'
      - 'CONTEXT.md'
      - 'LICENSE'
      - 'docs/media/**'
      - 'addons/glome/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'README.md'
      - 'CONTEXT.md'
      - 'LICENSE'
      - 'docs/media/**'
      - 'addons/glome/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: node scripts/check_design_contract.mjs
      - run: pnpm --dir site build
      - run: node scripts/check_docs_sync.mjs
